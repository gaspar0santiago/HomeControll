name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install server dependencies
        working-directory: home-controller
        run: npm ci

      - name: Syntax-check server.js
        working-directory: home-controller
        run: npm run check

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Syntax-check the Python helpers
        working-directory: home-controller
        run: python -m compileall -q . tools

      - name: Helpers import cleanly and the tools scripts run
        working-directory: home-controller
        run: |
          # plug_helper must be importable without executing a command:
          # tools/ imports load_device from it. A bare main() call at module
          # level breaks both tools scripts.
          pip install --quiet python-dotenv
          WORK=$(mktemp -d)
          mkdir -p "$WORK/tools"
          cp plug_helper.py "$WORK/"
          cp tools/plug_test.py tools/plug_test2.py "$WORK/tools/"
          printf 'class OutletDevice:\n    def __init__(self,*a,**k): pass\n    def set_version(self,v): pass\n    def turn_on(self): return {"stub":1}\n    def turn_off(self): return {"stub":0}\n    def status(self): return {}\n' > "$WORK/tinytuya.py"
          cat > "$WORK/.env" <<'ENV'
          PLUG_DISCO_ID=id1
          PLUG_DISCO_IP=10.0.0.1
          PLUG_DISCO_KEY=key1
          PLUG_DISCO_VER=3.3
          PLUG_SPOTLIGHT_ID=id2
          PLUG_SPOTLIGHT_IP=10.0.0.2
          PLUG_SPOTLIGHT_KEY=key2
          PLUG_SPOTLIGHT_VER=3.3
          PLUG_SPOTLIGHT2_ID=id3
          PLUG_SPOTLIGHT2_IP=10.0.0.3
          PLUG_SPOTLIGHT2_KEY=key3
          PLUG_SPOTLIGHT2_VER=3.5
          ENV
          sed -i 's/^ *//' "$WORK/.env"
          cd "$WORK"
          PYTHONPATH=. python -c "import plug_helper; print('import clean')"
          PYTHONPATH=. python plug_helper.py '{"device":"disco","on":true}' | grep -q '"ok": true'
          PYTHONPATH=. python tools/plug_test.py disco  > /dev/null
          PYTHONPATH=. python tools/plug_test2.py       > /dev/null
          # an unknown plug and a missing variable must both fail loudly
          PYTHONPATH=. python plug_helper.py '{"device":"nope"}' | grep -q 'Unknown plug'
          echo "helpers OK"

      - name: Server boots and serves its API with no cameras configured
        working-directory: home-controller
        env:
          PORT: '3999'
          CAMERA_IP: ''
          CAMERA2_IP: ''
        run: |
          node server.js & SRV=$!
          for i in $(seq 1 40); do
            curl -sf http://127.0.0.1:3999/lights/state >/dev/null && break
            sleep 0.25
          done
          test "$(curl -s http://127.0.0.1:3999/cameras)" = "[]"
          curl -sf http://127.0.0.1:3999/lights/state >/dev/null
          curl -sf http://127.0.0.1:3999/ >/dev/null
          curl -sf http://127.0.0.1:3999/lights >/dev/null
          kill $SRV

      - name: Syntax-check the door opener
        working-directory: door-opener
        run: npm run check

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check the Edge Functions
        working-directory: door-opener
        run: |
          # The functions import nothing remote on purpose, so this needs
          # no network and cannot break because a CDN moved.
          # Globbed rather than listed. A hand written list goes stale the
          # moment a function is added or removed, and the failure lands
          # here rather than anywhere near the change that caused it.
          deno check supabase/functions/_shared/*.ts supabase/functions/*/index.ts
          # Each bundle separately: with no imports they are scripts, not
          # modules, so checking them together collides on every name.
          for b in supabase/functions/*/bundled.ts; do deno check "$b"; done

      - name: The dashboard bundles match their sources
        working-directory: door-opener
        run: |
          # bundled.ts is committed so it can be copied straight from GitHub
          # by someone deploying through the Supabase dashboard with no
          # clone. Committed generated files rot silently, which is exactly
          # how door-poll survived in this workflow after being deleted, so
          # regenerate and fail on any difference.
          node tools/bundle-functions.js
          # status, not diff: diff ignores untracked files, so a bundle that
          # was never committed would pass a diff check vacuously.
          DIRTY=$(git status --porcelain -- 'supabase/functions/*/bundled.ts')
          if [ -n "$DIRTY" ]; then
            echo "$DIRTY"
            echo
            echo "bundled.ts is stale or untracked."
            echo "Run: node tools/bundle-functions.js  and commit the result."
            exit 1
          fi
          test -s supabase/functions/door-open/bundled.ts
          test -s supabase/functions/door-events/bundled.ts
          echo "bundles are current"

      - name: The pass CLI refuses a guest pass with no expiry
        working-directory: door-opener
        run: |
          # The one refusal that matters. A guest pass with no end date is
          # a permanent key sitting in a group chat.
          if node tools/make-pass.js guest --label "no expiry" >/dev/null 2>&1; then
            echo "make-pass.js generated a guest pass with no --until"
            exit 1
          fi
          node tools/make-pass.js guest --label "ok" --until "2099-01-01T00:00" | grep -q "GUEST PASS"
          node tools/make-pass.js resident --label "ok" | grep -q "RESIDENT PASS"
          # A pass that has already expired is dead on arrival.
          if node tools/make-pass.js guest --label "past" --until "2000-01-01T00:00" >/dev/null 2>&1; then
            echo "make-pass.js accepted an --until in the past"
            exit 1
          fi
          echo "CLI refusals OK"

      - name: The CLI's hash matches what the Edge Function computes
        working-directory: door-opener
        run: |
          # If these two ever drift, every pass silently stops working and
          # nothing else in this repo would notice.
          cat > /tmp/hashcheck.js <<'CHECK'
          const { execSync } = require('child_process');
          const crypto = require('crypto');

          const out = execSync('node tools/make-pass.js resident --label ci-check').toString();
          const pass = (out.match(/={40,}\s+([0-9A-Z-]+)\s+={40,}/) || [])[1];
          const salt = (out.match(/'([0-9a-f]{32})'/) || [])[1];
          const hash = (out.match(/'([0-9a-f]{64})'/) || [])[1];
          if (!pass || !salt || !hash) {
            console.error('could not parse the CLI output'); process.exit(1);
          }

          const normalised = pass.toUpperCase().replace(/[^0-9A-Z]/g, '');
          const fromCli = crypto
            .pbkdf2Sync(normalised, Buffer.from(salt, 'hex'), 120000, 32, 'sha256')
            .toString('hex');
          if (fromCli !== hash) {
            console.error('the printed pass does not hash to the printed SQL'); process.exit(1);
          }

          // Same derivation the Edge Function runs, through the same
          // WebCrypto API Deno gives it.
          crypto.webcrypto.subtle
            .importKey('raw', new TextEncoder().encode(normalised), 'PBKDF2', false, ['deriveBits'])
            .then(key => crypto.webcrypto.subtle.deriveBits(
              { name: 'PBKDF2', hash: 'SHA-256', salt: new Uint8Array(Buffer.from(salt, 'hex')), iterations: 120000 },
              key, 256))
            .then(bits => {
              const fromEdge = Buffer.from(bits).toString('hex');
              if (fromEdge !== hash) {
                console.error('WebCrypto and pbkdf2Sync disagree: no pass would ever match');
                process.exit(1);
              }
              console.log('CLI and Edge Function derive the same hash');
            });
          CHECK
          node /tmp/hashcheck.js

      - name: A wrong device key looks exactly like a quiet door
        working-directory: door-opener
        run: |
          # door_claim is reachable by anon, because the ESP32 calls it
          # through PostgREST rather than an Edge Function. The device key
          # is what actually gates it, and a wrong one must return no rows
          # rather than an error, so it cannot be told apart from a door
          # with nothing waiting.
          #
          # Also checks make-key.js and the SQL agree on the hash. If they
          # ever drift, the board silently never opens the door.
          sudo systemctl start postgresql || sudo service postgresql start
          PSQL="sudo -u postgres psql -v ON_ERROR_STOP=1 -q"
          $PSQL -c 'drop database if exists doorci;' -c 'create database doorci;'
          # Roles are cluster wide, so creating them must survive a rerun.
          $PSQL -d doorci -c "do \$\$ begin
              if not exists (select 1 from pg_roles where rolname='anon')
                then create role anon; end if;
              if not exists (select 1 from pg_roles where rolname='authenticated')
                then create role authenticated; end if;
              if not exists (select 1 from pg_roles where rolname='service_role')
                then create role service_role bypassrls; end if;
            end \$\$;"
          $PSQL -d doorci -f supabase/schema.sql

          KEY=$(node -e "
            const c = require('crypto');
            const k = c.randomBytes(32).toString('base64url');
            console.log(k + ' ' + c.createHash('sha256').update(k).digest('hex'));
          ")
          set -- $KEY
          PLAINTEXT=$1
          CLI_HASH=$2

          SQL_HASH=$(sudo -u postgres psql -d doorci -tAc \
            "select encode(sha256('$PLAINTEXT'::bytea),'hex');")
          if [ "$CLI_HASH" != "$SQL_HASH" ]; then
            echo "make-key.js and door_claim disagree on the hash"
            exit 1
          fi

          sudo -u postgres psql -d doorci -q \
            -c "insert into door_keys (name, hash) values ('device', '$CLI_HASH');" \
            -c "insert into door_passes (id, label, kind, salt, hash, iterations)
                values ('22222222-2222-2222-2222-222222222222', 'ci', 'resident',
                        repeat('c',32), repeat('d',64), 120000);" \
            -c "insert into door_commands (pass_id, expires_at)
                values ('22222222-2222-2222-2222-222222222222', now() + interval '30 seconds');"

          claim() {
            sudo -u postgres psql -d doorci -tAc \
              "set role anon; select coalesce((select command_id::text from door_claim('ci','$1')),'none');" \
              | tail -1
          }

          test "$(claim wrong-key)" = "none"        # a command IS waiting
          test "$(claim "$PLAINTEXT")" != "none"    # the right key takes it
          test "$(claim "$PLAINTEXT")" = "none"     # and only once

          # Granting door_claim to anon must not have opened anything else.
          for stmt in "select count(*) from door_passes" \
                      "select count(*) from door_keys" \
                      "select count(*) from door_candidates()" \
                      "select count(*) from door_recent_events(5)"; do
            if sudo -u postgres psql -d doorci -tAc "set role anon; $stmt;" >/dev/null 2>&1; then
              echo "anon could run: $stmt"
              exit 1
            fi
          done
          echo "claim path OK"

      - name: Reading a Tapo bulb does not switch it on
        working-directory: home-controller
        run: |
          # tapo_helper.py switches the bulb on before every command. The
          # door opener's flash reads the bulb first so it can put it back
          # exactly, and a read that fell through to that device.on() would
          # light the room every time it looked.
          WORK=$(mktemp -d)
          cp tapo_helper.py "$WORK/"
          cat > "$WORK/tapo.py" <<'STUB'
          import sys

          def _log(name):
              print('CALL ' + name, file=sys.stderr)

          class _Info:
              device_on = True
              brightness = 47
              hue = 210
              saturation = 88
              color_temp = 0

          class _Device:
              async def on(self): _log('on')
              async def off(self): _log('off')
              async def get_device_info(self): _log('get_device_info'); return _Info()
              async def set_brightness(self, value): _log('set_brightness')
              async def set_hue_saturation(self, h, s): _log('set_hue_saturation')
              async def set_color_temperature(self, t): _log('set_color_temperature')

          class ApiClient:
              def __init__(self, email, password): pass
              def __getattr__(self, name):
                  async def connect(ip): return _Device()
                  return connect
          STUB
          cd "$WORK"
          ARGS='{"email":"e","password":"p","ip":"10.0.0.9","action":"read"}'
          PYTHONPATH=. python tapo_helper.py "$ARGS" > read.out 2> read.err
          grep -q '"device_on": true' read.out
          grep -q '"brightness": 47' read.out
          if grep -q '^CALL on$' read.err; then
            echo "a state read switched the bulb on"
            exit 1
          fi
          grep -q '^CALL get_device_info$' read.err
          # And the ordinary write path must still switch it on.
          PYTHONPATH=. python tapo_helper.py '{"email":"e","password":"p","ip":"10.0.0.9","brightness":50}' > set.out 2> set.err
          grep -q '"ok": true' set.out
          grep -q '^CALL on$' set.err
          echo "tapo read path OK"

      - name: The door panel polls, primes and stays read only
        working-directory: home-controller
        run: |
          # Fake door-events feed, so the panel can be exercised without a
          # Supabase project.
          cat > /tmp/fakedoor.js <<'FAKE'
          const http = require('http');
          const events = [
            { id: 40, at: new Date().toISOString(), outcome: 'opened',  label: 'Sat party' },
            { id: 39, at: new Date().toISOString(), outcome: 'unknown', label: null },
          ];
          http.createServer((req, res) => {
            if (req.headers['x-dashboard-key'] !== 'ci-dashboard-key') {
              res.writeHead(401, { 'Content-Type': 'application/json' });
              return res.end('{"events":[]}');
            }
            res.writeHead(200, { 'Content-Type': 'application/json' });
            res.end(JSON.stringify({ events }));
          }).listen(4711);
          FAKE
          node /tmp/fakedoor.js & FAKE=$!
          sleep 1

          # Unconfigured: the panel reports itself off and nothing polls.
          PORT=3994 CAMERA_IP='' CAMERA2_IP='' node server.js > off.log 2>&1 & OFF=$!
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3994/lights/state >/dev/null && break; sleep 0.25; done
          test "$(curl -s http://127.0.0.1:3994/door/events)" = '{"configured":false,"error":null,"events":[]}'
          grep -q 'Door panel disabled' off.log
          kill $OFF

          # Configured: events arrive, and the first fetch primes the id
          # rather than replaying the last ten opens after a restart.
          PORT=3993 CAMERA_IP='' CAMERA2_IP='' \
            DOOR_EVENTS_URL=http://127.0.0.1:4711/door-events \
            DOOR_DASHBOARD_KEY=ci-dashboard-key \
            node server.js > on.log 2>&1 & ON=$!
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3993/lights/state >/dev/null && break; sleep 0.25; done
          sleep 2
          curl -s http://127.0.0.1:3993/door/events | grep -q '"Sat party"'
          curl -s http://127.0.0.1:3993/door/events | grep -q '"configured":true'
          grep -q 'Door panel primed at event 40' on.log
          # DOOR_FLASH_IP is unset, so nothing was flashed. More to the
          # point, nothing was claimed: this server has no path to
          # door_claim and must never grow one, or it would race the ESP32.
          if grep -qi 'claim' on.log; then echo "server tried to claim a door command"; exit 1; fi
          kill $ON

          # A bad key must show as unreachable, not as an empty log that
          # looks like a quiet night.
          PORT=3992 CAMERA_IP='' CAMERA2_IP='' \
            DOOR_EVENTS_URL=http://127.0.0.1:4711/door-events \
            DOOR_DASHBOARD_KEY=wrong-key \
            node server.js > bad.log 2>&1 & BAD=$!
          for i in $(seq 1 40); do curl -sf http://127.0.0.1:3992/lights/state >/dev/null && break; sleep 0.25; done
          sleep 2
          curl -s http://127.0.0.1:3992/door/events | grep -q '"error":"HTTP 401"'
          kill $BAD
          kill $FAKE
          echo "door panel OK"

      - name: The ESP32 sketch compiles
        working-directory: door-opener/firmware/test
        run: ./compile-check.sh

      - name: The ESP32 sets the relay level before the pin direction
        working-directory: door-opener/firmware/door_opener
        run: |
          # Switching the pin to OUTPUT first drives the latched 0, which
          # on an active low module opens the street door on every reset.
          # There is no Arduino toolchain here, so check the order directly.
          WRITE=$(grep -n 'digitalWrite(RELAY_PIN, RELAY_OFF);' door_opener.ino | head -1 | cut -d: -f1)
          MODE=$(grep -n 'pinMode(RELAY_PIN, OUTPUT);' door_opener.ino | head -1 | cut -d: -f1)
          test -n "$WRITE" && test -n "$MODE"
          if [ "$WRITE" -ge "$MODE" ]; then
            echo "pinMode comes before digitalWrite: the door opens on every reset"
            exit 1
          fi
          # relaySafe() has to be the first thing setup() does, before
          # Serial and WiFi, which take time.
          SETUP=$(grep -n 'void setup()' door_opener.ino | cut -d: -f1)
          SAFE=$(grep -n '  relaySafe();' door_opener.ino | head -1 | cut -d: -f1)
          SERIALLINE=$(grep -n 'Serial.begin' door_opener.ino | cut -d: -f1)
          test "$SAFE" -gt "$SETUP" && test "$SAFE" -lt "$SERIALLINE"
          echo "relay boot order OK"

      - name: Fail if a .env or tinytuya artifact was ever committed
        run: |
          if git ls-files --error-unmatch \
              home-controller/.env door-opener/.env \
              door-opener/firmware/door_opener/config.h \
              tinytuya.json devices.json \
              snapshot.json tuya-raw.json 2>/dev/null; then
            echo "A secret-bearing file is tracked by git"
            exit 1
          fi
          echo "No secret-bearing files tracked"
