<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lights</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #111118;
    --surface2: #21212e;
    --border: rgba(255,255,255,0.13);
    --accent: #c8ff00;
    --text: #f0f0f0;
    --muted: rgba(240,240,240,0.55);
    --warm: #ffb347;
    --cool: #87ceeb;
    --party: #c084fc;
    --gaming: #34d399;
    --ease: cubic-bezier(0.16, 1, 0.3, 1);
    --dur: 180ms;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    min-height: 100vh;
    padding: 32px;
    display: flex;
    flex-direction: column;
    gap: 28px;
  }

  header { display: flex; align-items: center; justify-content: space-between; }
  .brand { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: 0.08em; color: var(--accent); text-transform: uppercase; }
  .clock { font-size: 32px; font-weight: 300; letter-spacing: 0.12em; }

  .panel-label { font-family: 'Syne', sans-serif; font-size: 12px; letter-spacing: 0.15em; color: var(--muted); text-transform: uppercase; margin-bottom: 16px; }

  .global-scenes { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 16px; }

  .scene-btn {
    padding: 28px 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.22);
    background: #1e1e2b; color: rgba(240,240,240,0.85);
    font-family: 'Syne', sans-serif; font-weight: 700; font-size: 18px;
    cursor: pointer; display: flex; flex-direction: column; align-items: center;
    gap: 12px; transition: all 0.2s; letter-spacing: 0.03em;
  }
  .scene-btn .icon { font-size: 36px; }
  .scene-btn:active { transform: scale(0.97); }
  .scene-btn.work-scene.active { background: rgba(135,206,235,0.12); border-color: var(--cool); color: var(--cool); }
  .scene-btn.party-scene.active { background: rgba(192,132,252,0.12); border-color: var(--party); color: var(--party); }
  .scene-btn.cosy-scene.active { background: rgba(255,179,71,0.12); border-color: var(--warm); color: var(--warm); }
  .scene-btn.gaming-scene.active { background: rgba(52,211,153,0.12); border-color: var(--gaming); color: var(--gaming); }

  .global-brightness {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 20px; padding: 24px 28px;
    display: flex; flex-direction: column; gap: 16px;
  }
  .bri-header { display: flex; align-items: center; justify-content: space-between; }
  .bri-label { font-size: 14px; color: var(--muted); letter-spacing: 0.08em; text-transform: uppercase; }
  .bri-val { font-size: 20px; color: var(--accent); font-weight: 500; }

  input[type=range] { -webkit-appearance: none; width: 100%; height: 8px; border-radius: 4px; background: var(--surface2); outline: none; cursor: pointer; }
  input[type=range].accent-thumb::-webkit-slider-thumb { -webkit-appearance: none; width: 32px; height: 32px; background: var(--accent); border-radius: 50%; cursor: pointer; box-shadow: 0 0 10px rgba(200,255,0,0.4); }
  input[type=range].white-thumb::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; background: var(--text); border-radius: 50%; cursor: pointer; }
  input[type=range].hue-slider { background: linear-gradient(to right, hsl(0,90%,50%), hsl(40,90%,50%), hsl(80,90%,50%), hsl(120,90%,50%), hsl(160,90%,50%), hsl(200,90%,50%), hsl(240,90%,50%), hsl(280,90%,50%), hsl(320,90%,50%), hsl(360,90%,50%)); }
  input[type=range].hue-slider::-webkit-slider-thumb { -webkit-appearance: none; width: 28px; height: 28px; background: white; border-radius: 50%; cursor: pointer; box-shadow: 0 2px 6px rgba(0,0,0,0.5); }

  .divider { height: 1px; background: var(--border); }
  .zones-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; }
  .zone-card.bar-card { gap: 16px; }
  .fairy-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .individual-layout { display: flex; flex-direction: column; gap: 16px; }
  .bottom-row { display: flex; gap: 16px; align-items: stretch; }
  .bottom-row .bar-container { flex: 1; }
  .disco-zone { width: 150px; flex-shrink: 0; background: var(--surface); border: 1px solid var(--border); border-radius: 20px; display: flex; flex-direction: column; justify-content: space-evenly; align-items: center; padding: 20px 10px; transition: border-color 0.2s; gap: 14px; }
  .disco-zone.lit { border-color: rgba(200,255,0,0.3); }
  .disco-zone .disco-emoji { font-size: 70px; }
  .disco-zone .disco-label { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); text-orientation: mixed; }

  .zone-card { background: var(--surface); border: 1px solid var(--border); border-radius: 20px; padding: 24px; transition: border-color 0.2s; display: flex; flex-direction: column; gap: 16px; }
  .zone-card.lit { border-color: rgba(200,255,0,0.3); }
  .bar-top { display: flex; align-items: center; justify-content: space-between; }
  .bar-label { display: flex; align-items: center; gap: 12px; }
  .bar-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--border); transition: background 0.3s, box-shadow 0.3s; }
  .zone-card.lit .bar-dot { background: var(--accent); box-shadow: 0 0 10px var(--accent); }

  .bar-effects { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .bar-effect-btn { padding: 16px 8px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.22); background: #2e2e42; color: rgba(240,240,240,0.85); font-family: 'DM Mono', monospace; font-size: 14px; cursor: pointer; text-align: center; transition: all 0.15s; }
  .bar-effect-btn:active { transform: scale(0.95); }
  .bar-effect-btn.active { background: rgba(200,255,0,0.15); border-color: var(--accent); color: var(--accent); }

  .zone-header { display: flex; align-items: center; justify-content: space-between; }
  .zone-name { font-family: 'Syne', sans-serif; font-weight: 700; font-size: 20px; }

  .toggle { width: 64px; height: 34px; background: var(--surface2); border-radius: 17px; border: 1px solid var(--border); cursor: pointer; position: relative; transition: background 0.25s; flex-shrink: 0; }
  .toggle.on { background: var(--accent); border-color: var(--accent); }
  .toggle::after { content: ''; position: absolute; width: 28px; height: 28px; background: white; border-radius: 50%; top: 2px; left: 2px; transition: transform 0.25s; box-shadow: 0 2px 6px rgba(0,0,0,0.3); }
  .toggle.on::after { transform: translateX(30px); }

  .zone-modes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .zone-mode-btn { padding: 16px 8px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.22); background: #2e2e42; color: rgba(240,240,240,0.85); font-family: 'DM Mono', monospace; font-size: 14px; cursor: pointer; text-align: center; transition: all 0.15s; }
  .zone-mode-btn:active { transform: scale(0.95); }
  .zone-mode-btn.work.active { background: rgba(135,206,235,0.15); border-color: var(--cool); color: var(--cool); }
  .zone-mode-btn.party.active { background: rgba(192,132,252,0.15); border-color: var(--party); color: var(--party); }
  .zone-mode-btn.cosy.active { background: rgba(255,179,71,0.15); border-color: var(--warm); color: var(--warm); }
  .zone-mode-btn.gaming.active { background: rgba(52,211,153,0.15); border-color: var(--gaming); color: var(--gaming); }

  .zone-bri { display: flex; align-items: center; gap: 12px; }
  .zone-bri-label { font-size: 11px; color: var(--muted); letter-spacing: 0.06em; text-transform: uppercase; flex-shrink: 0; width: 36px; }
  .zone-bri-val { font-size: 13px; color: var(--muted); flex-shrink: 0; width: 36px; text-align: right; }

  .fx-label { font-size: 10px; color: var(--muted); letter-spacing: 0.1em; text-transform: uppercase; }
  .fx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .fx-grid-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .fx-btn { padding: 14px 6px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.22); background: #2e2e42; color: rgba(240,240,240,0.85); font-family: 'DM Mono', monospace; font-size: 12px; cursor: pointer; text-align: center; transition: all 0.15s; }
  .fx-btn:active { transform: scale(0.95); }
  .fx-btn.active { background: rgba(255,179,71,0.15); border-color: var(--warm); color: var(--warm); }

  /* ── Icons ────────────────────────────────────────────────────
     Replaces the emoji that used to sit in every label. Strokes
     inherit currentColor so an icon picks up its button's colour,
     including the per-scene active colours. */
  .ico { width: 1.15em; height: 1.15em; flex: 0 0 auto;
         stroke: currentColor; fill: none; stroke-width: 1.75;
         stroke-linecap: round; stroke-linejoin: round; }
  .ico .solid { fill: currentColor; stroke: none; }
  .scene-btn .ico { width: 28px; height: 28px; stroke-width: 1.5; }
  .brand .ico { width: 0.9em; height: 0.9em; stroke-width: 2; }
  .panel-label .ico, .bri-label .ico, .fx-label .ico { width: 1.05em; height: 1.05em; }

  /* Icon + text need to sit on a shared baseline. */
  .zone-mode-btn, .bar-effect-btn, .fx-btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  }
  .panel-label, .bri-label, .fx-label, .brand { display: inline-flex; align-items: center; gap: 7px; }

  /* ── Touch targets ────────────────────────────────────────────
     Everything a finger lands on clears 44px. */
  .zone-mode-btn, .bar-effect-btn { min-height: 44px; }

  /* The slider is the important one. The input box used to be only as
     tall as the visible track (4px), so the thumb overflowed it and the
     real grab area was a 4px strip. The input is now 40px tall and
     transparent, with the thin track drawn by the runnable-track
     pseudo-element, so it looks the same and can actually be hit. */
  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 44px; margin: 0;
    background: transparent; outline: none; cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 8px; border-radius: calc(8px / 2); background: var(--surface2);
  }
  input[type=range]::-moz-range-track {
    height: 8px; border-radius: calc(8px / 2); background: var(--surface2);
  }
  input[type=range].accent-thumb::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 32px; height: 32px; margin-top: -12px;
    background: var(--accent); border-radius: 50%;
    box-shadow: 0 0 8px rgba(200,255,0,0.4);
    transition: transform var(--dur) var(--ease);
  }
  input[type=range].white-thumb::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 28px; height: 28px; margin-top: -10px;
    background: var(--text); border-radius: 50%;
    transition: transform var(--dur) var(--ease);
  }
  input[type=range]:active::-webkit-slider-thumb { transform: scale(1.15); }
  input[type=range].accent-thumb::-moz-range-thumb {
    width: 32px; height: 32px; background: var(--accent);
    border: none; border-radius: 50%;
  }
  input[type=range].white-thumb::-moz-range-thumb {
    width: 28px; height: 28px; background: var(--text);
    border: none; border-radius: 50%;
  }

  /* ── Motion ───────────────────────────────────────────────────
     Ease-out only, no bounce. Named properties, never `all`. */
  .toggle { transition: background-color var(--dur) var(--ease),
                        border-color var(--dur) var(--ease); }
  .toggle::after { transition: transform var(--dur) var(--ease); }
  .zone-card, .disco-zone { transition: border-color var(--dur) var(--ease),
                                        box-shadow var(--dur) var(--ease); }
  .zone-mode-btn, .bar-effect-btn, .fx-btn, .scene-btn {
    transition: background-color var(--dur) var(--ease),
                border-color var(--dur) var(--ease),
                color var(--dur) var(--ease),
                transform 90ms var(--ease);
  }
  .zone-mode-btn:active, .bar-effect-btn:active, .fx-btn:active { transform: scale(0.96); }
  .zone-card.lit { box-shadow: 0 0 0 1px rgba(200,255,0,0.06), 0 6px 28px -14px rgba(200,255,0,0.4); }
  .disco-zone.lit { box-shadow: 0 0 0 1px rgba(200,255,0,0.06), 0 6px 28px -14px rgba(200,255,0,0.4); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      transition-duration: 0.01ms !important;
      animation-duration: 0.01ms !important;
    }
  }

  /* Hue slider: gradient moves from the input onto the track, so the
     input itself can be a tall transparent hit area like the others. */
  input[type=range].hue-slider { background: transparent; }
  input[type=range].hue-slider::-webkit-slider-runnable-track {
    height: 8px; border-radius: 4px;
    background: linear-gradient(to right, hsl(0,90%,50%), hsl(40,90%,50%), hsl(80,90%,50%), hsl(120,90%,50%), hsl(160,90%,50%), hsl(200,90%,50%), hsl(240,90%,50%), hsl(280,90%,50%), hsl(320,90%,50%), hsl(360,90%,50%));
  }
  input[type=range].hue-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 28px; height: 28px; margin-top: -10px;
    background: #fff; border-radius: 50%; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
    transition: transform var(--dur) var(--ease);
  }
  /* 5 music buttons read better as 3+2 than 2+2+1, and it saves a row. */
  .fx-grid { grid-template-columns: 1fr 1fr 1fr; }
  .fx-btn { min-height: 44px; }

  /* Slider rows got taller so the touch target is real; claw the page
     height back out of card padding and gaps rather than the targets. */
  .zone-card { padding: 18px; gap: 11px; }
  .fairy-grid { gap: 14px; }
  .individual-layout { gap: 12px; }
  .zone-bri { gap: 12px; margin: -4px 0; }
  .fx-grid { gap: 7px; }
  .fx-btn { padding: 10px 6px; }
  .panel-label { margin-bottom: 11px; }
  /* Living Room has a fourth scene button; four across keeps it on one
     row instead of orphaning Gaming underneath. */
  .zone-card:has(.zone-mode-btn.gaming) .zone-modes { grid-template-columns: repeat(4, 1fr); }
  .zone-card:has(.zone-mode-btn.gaming) .zone-mode-btn { font-size: 13px; gap: 5px; }
  .zones-grid { align-items: start; }
</style>
</head>
<body>
<!-- Monochrome icon set. Every symbol inherits currentColor, so an icon
     takes the colour of whatever button or label it sits in. -->

<header>
  <div class="brand"><svg class="ico" aria-hidden="true"><use href="#i-home"/></svg>Lights</div>
  <div class="clock" id="clock">00:00</div>
</header>

<div>
  <div class="panel-label">All Zones</div>
  <div class="global-scenes">
    <button class="scene-btn work-scene" id="global-work" onclick="globalScene('work')"><span class="icon"><svg class="ico" aria-hidden="true"><use href="#i-sun"/></svg></span>Work</button>
    <button class="scene-btn party-scene" id="global-party" onclick="globalScene('party')"><span class="icon"><svg class="ico" aria-hidden="true"><use href="#i-sparkle"/></svg></span>Party</button>
    <button class="scene-btn cosy-scene" id="global-cosy" onclick="globalScene('cosy')"><span class="icon"><svg class="ico" aria-hidden="true"><use href="#i-flame"/></svg></span>Cosy</button>
    <button class="scene-btn gaming-scene" id="global-gaming" onclick="globalScene('gaming')"><span class="icon"><svg class="ico" aria-hidden="true"><use href="#i-gamepad"/></svg></span>Gaming</button>
  </div>
</div>

<div class="global-brightness">
  <div class="bri-header">
    <span class="bri-label"><svg class="ico" aria-hidden="true"><use href="#i-sun"/></svg>All Brightness</span>
    <span class="bri-val" id="global-bri-val">80%</span>
  </div>
  <input type="range" class="accent-thumb" min="1" max="100" value="80" id="global-bri-slider"
    oninput="onGlobalBriInput(this.value)" onchange="sendGlobalBrightness(this.value)">
</div>

<div class="divider"></div>

<div>
  <div class="panel-label">Individual Zones</div>
  <div class="individual-layout">
    <div class="zones-grid" id="zones-container"></div>
    <div class="bottom-row">

<script>
// Served from the controller itself, so relative URLs work and keep
// working if the server's LAN address ever changes.
const SERVER = '';
const FAIRY_MACS = ['FF:24:12:11:07:D6', 'FF:24:12:11:0D:C6'];
let gamingTableBri = 40;
const MUSIC_MODES = ['energy','rhythm','rolling','spectrum','rainbow'];

function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleTimeString('en-NZ', { hour: '2-digit', minute: '2-digit', hour12: false });
}
updateClock(); setInterval(updateClock, 1000);

const ZONES = [
  { name: "Living Room", switchOnly: false, devices: [{ ip: "192.168.68.61" }, { ip: "192.168.68.68" }, { ip: "192.168.68.63" }, { ip: "192.168.68.71" }, { ip: "192.168.68.53" }, { ip: "192.168.68.69" }] },
  { name: "Living Room Plus", switchOnly: false, devices: [{ ip: "192.168.68.75" }, { ip: "192.168.68.78" }] },
  { name: "Balcony", switchOnly: false, devices: [{ ip: "192.168.68.50" }, { ip: "192.168.68.51" }, { ip: "192.168.68.52" }] },
  { name: "Bar", switchOnly: true, devices: [{ ip: "192.168.68.80" }] }
];

const zoneState = {};
ZONES.forEach(z => { zoneState[z.name] = { on: false, mode: null, brightness: 80 }; });
let activeGlobalScene = null, syncPaused = false;

const container = document.getElementById('zones-container');
const barContainer = document.getElementById('bar-container');
ZONES.forEach(zone => {
  const key = zone.name.replace(/\s/g, '_');
  const card = document.createElement('div');
  card.className = 'zone-card' + (zone.switchOnly ? ' bar-card' : '');
  card.id = 'zone-' + key;
  if (zone.switchOnly) {
    card.innerHTML = `
      <div class="bar-top">
        <div class="bar-label"><div class="bar-dot"></div><div class="zone-name">${zone.name}</div></div>
        <div class="toggle" id="toggle-${key}" onclick="toggleZone('${zone.name}')"></div>
      </div>
      <div class="bar-effects">
        <button class="bar-effect-btn" id="bfx-${key}-rainbow"   onclick="setBarEffect('${zone.name}','rainbow')"><svg class="ico" aria-hidden="true"><use href="#i-rainbow"/></svg>Rainbow</button>
        <button class="bar-effect-btn" id="bfx-${key}-aurora"    onclick="setBarEffect('${zone.name}','aurora')"><svg class="ico" aria-hidden="true"><use href="#i-aurora"/></svg>Aurora</button>
        <button class="bar-effect-btn" id="bfx-${key}-ocean"     onclick="setBarEffect('${zone.name}','ocean')"><svg class="ico" aria-hidden="true"><use href="#i-wave"/></svg>Ocean</button>
        <button class="bar-effect-btn" id="bfx-${key}-sunset"    onclick="setBarEffect('${zone.name}','sunset')"><svg class="ico" aria-hidden="true"><use href="#i-sunset"/></svg>Sunset</button>
        <button class="bar-effect-btn" id="bfx-${key}-lightning" onclick="setBarEffect('${zone.name}','lightning')"><svg class="ico" aria-hidden="true"><use href="#i-bolt"/></svg>Lightning</button>
        <button class="bar-effect-btn" id="bfx-${key}-flicker"   onclick="setBarEffect('${zone.name}','flicker')"><svg class="ico" aria-hidden="true"><use href="#i-bulb"/></svg>Flicker</button>
      </div>`;
  } else {
    card.innerHTML = `
      <div class="zone-header">
        <div class="zone-name">${zone.name}</div>
        <div class="toggle" id="toggle-${key}" onclick="toggleZone('${zone.name}')"></div>
      </div>
      <div class="zone-modes">
        <button class="zone-mode-btn work" id="mode-${key}-work" onclick="setZoneScene('${zone.name}','work')"><svg class="ico" aria-hidden="true"><use href="#i-sun"/></svg>Work</button>
        <button class="zone-mode-btn party" id="mode-${key}-party" onclick="setZoneScene('${zone.name}','party')"><svg class="ico" aria-hidden="true"><use href="#i-sparkle"/></svg>Party</button>
        <button class="zone-mode-btn cosy" id="mode-${key}-cosy" onclick="setZoneScene('${zone.name}','cosy')"><svg class="ico" aria-hidden="true"><use href="#i-flame"/></svg>Cosy</button>
        ${zone.name === 'Living Room' ? `<button class="zone-mode-btn gaming" id="mode-${key}-gaming" onclick="setZoneScene('${zone.name}','gaming')"><svg class="ico" aria-hidden="true"><use href="#i-gamepad"/></svg>Gaming</button>` : ''}
      </div>
      <div class="zone-bri">
        <span class="zone-bri-label">Bri</span>
        <input type="range" class="white-thumb" min="1" max="100" value="80" id="bri-${key}"
          oninput="onZoneBriInput('${zone.name}',this.value)" onchange="sendZoneBrightness('${zone.name}',this.value)">
        <span class="zone-bri-val" id="bri-val-${key}">80%</span>
      </div>
      ${zone.name === 'Living Room' ? `
      <div class="zone-bri">
        <span class="zone-bri-label">Table</span>
        <input type="range" class="white-thumb" min="1" max="100" value="40" id="table-bri"
          oninput="onTableBriInput(this.value)" onchange="sendTableBrightness(this.value)">
        <span class="zone-bri-val" id="table-bri-val">40%</span>
      </div>` : ''}`;
  }
  if (zone.switchOnly) barContainer.appendChild(card);
  else container.appendChild(card);
});

function updateToggleUI(z,on){const k=z.replace(/\s/g,'_');document.getElementById('toggle-'+k)?.classList.toggle('on',on);document.getElementById('zone-'+k)?.classList.toggle('lit',on);}
function clearModeButtons(z){const k=z.replace(/\s/g,'_');['work','party','cosy','gaming'].forEach(m=>document.getElementById('mode-'+k+'-'+m)?.classList.remove('active'));}
function clearRainbow(z){const k=z.replace(/\s/g,'_');BAR_EFFECTS.forEach(fx=>document.getElementById('bfx-'+k+'-'+fx)?.classList.remove('active'));}
function setModeButton(z,mode){const k=z.replace(/\s/g,'_');['work','party','cosy','gaming'].forEach(m=>document.getElementById('mode-'+k+'-'+m)?.classList.toggle('active',m===mode));}

async function pushState(u){syncPaused=true;await fetch(SERVER+'/lights/state',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(u)});setTimeout(()=>{syncPaused=false;},2000);}

async function pullState(){
  if(syncPaused)return;
  try{
    const data=await(await fetch(SERVER+'/lights/state')).json();
    document.querySelectorAll('.scene-btn').forEach(b=>b.classList.remove('active'));
    if(data.globalScene)document.getElementById('global-'+data.globalScene)?.classList.add('active');
    activeGlobalScene=data.globalScene;
    const sl=document.getElementById('global-bri-slider'),bv=document.getElementById('global-bri-val');
    if(sl&&!sl.matches(':active')){sl.value=data.globalBrightness;bv.textContent=data.globalBrightness+'%';}
    ZONES.forEach(zone=>{
      const s=data.zones[zone.name];if(!s)return;
      const prev=zoneState[zone.name];
      if(prev.on!==s.on||prev.mode!==s.mode||prev.brightness!==s.brightness){
        zoneState[zone.name]={...s};updateToggleUI(zone.name,s.on);
        if(!zone.switchOnly){if(s.mode)setModeButton(zone.name,s.mode);else clearModeButtons(zone.name);const k=zone.name.replace(/\s/g,'_');const bs=document.getElementById('bri-'+k);const bv2=document.getElementById('bri-val-'+k);if(bs&&!bs.matches(':active')){bs.value=s.brightness;if(bv2)bv2.textContent=s.brightness+'%';}}
        else{const bk=zone.name.replace(/\s/g,'_');BAR_EFFECTS.forEach(fx=>document.getElementById('bfx-'+bk+'-'+fx)?.classList.remove('active'));if(s.on&&s.mode)document.getElementById('bfx-'+bk+'-'+s.mode)?.classList.add('active');}
      }
    });
    if(data.plugs){
      if(data.plugs.disco!==undefined&&data.plugs.disco!==discoOn){discoOn=data.plugs.disco;document.getElementById('disco-toggle')?.classList.toggle('on',discoOn);document.getElementById('disco-card')?.classList.toggle('lit',discoOn);}
      if(data.plugs.spotlight!==undefined&&data.plugs.spotlight!==spotlightOn){spotlightOn=data.plugs.spotlight;document.getElementById('spotlight-toggle')?.classList.toggle('on',spotlightOn);document.getElementById('spotlight-card')?.classList.toggle('lit',spotlightOn);}
      if(data.plugs.spotlight2!==undefined&&data.plugs.spotlight2!==spotlight2On){spotlight2On=data.plugs.spotlight2;document.getElementById('spotlight2-toggle')?.classList.toggle('on',spotlight2On);document.getElementById('spotlight2-card')?.classList.toggle('lit',spotlight2On);}
    }
  }catch(e){}
}
setInterval(pullState,3000);

function toggleZone(z){const s=zoneState[z];s.on=!s.on;if(!s.on){s.mode=null;clearModeButtons(z);clearRainbow(z);}updateToggleUI(z,s.on);pushState({zone:z,on:s.on,mode:s.mode});const zone=ZONES.find(zz=>zz.name===z);if(zone.switchOnly&&s.on)zone.devices.forEach(d=>sendTapo(d.ip,{on:true,effect:zoneState[z].mode||'rainbow'}));else zone.devices.forEach(d=>sendTapo(d.ip,{on:s.on}));}
function setZoneScene(z,scene){
  zoneState[z].on=true;zoneState[z].mode=scene;
  updateToggleUI(z,true);setModeButton(z,scene);
  pushState({zone:z,on:true,mode:scene});
  if(scene==='gaming'&&z==='Living Room'){
    const GAMING_WARM_IPS=['192.168.68.63','192.168.68.71'];
    const bri=zoneState[z].brightness;
    ZONES.find(zz=>zz.name==='Living Room').devices.forEach(d=>{
      if(GAMING_WARM_IPS.includes(d.ip))sendTapo(d.ip,{on:true,color_temp:2700,brightness:gamingTableBri});
      else sendTapo(d.ip,{on:true,hue:Math.floor(Math.random()*360),saturation:90,brightness:bri});
    });
  } else {
    applyScene(ZONES.find(zz=>zz.name===z).devices,scene,zoneState[z].brightness);
  }
}
const BAR_EFFECTS = ['rainbow','aurora','ocean','sunset','lightning','flicker'];

function setBarEffect(zoneName, effect) {
  const key = zoneName.replace(/\s/g, '_');
  zoneState[zoneName].on = true; zoneState[zoneName].mode = effect;
  updateToggleUI(zoneName, true);
  BAR_EFFECTS.forEach(fx => document.getElementById('bfx-'+key+'-'+fx)?.classList.remove('active'));
  document.getElementById('bfx-'+key+'-'+effect)?.classList.add('active');
  pushState({ zone: zoneName, on: true, mode: effect });
  ZONES.find(z => z.name === zoneName).devices.forEach(d => sendTapo(d.ip, { on: true, effect }));
}



function globalScene(scene){
  if(activeGlobalScene===scene){activeGlobalScene=null;document.querySelectorAll('.scene-btn').forEach(b=>b.classList.remove('active'));pushState({globalScene:null});FAIRY_MACS.forEach(mac=>sendFairy(mac,{on:false}));sendPlug(false,'disco');discoOn=false;document.getElementById('disco-toggle').classList.remove('on');document.getElementById('disco-card').classList.remove('lit');sendPlug(false,'spotlight');spotlightOn=false;document.getElementById('spotlight-toggle').classList.remove('on');document.getElementById('spotlight-card').classList.remove('lit');sendPlug(false,'spotlight2');spotlight2On=false;document.getElementById('spotlight2-toggle').classList.remove('on');document.getElementById('spotlight2-card').classList.remove('lit');[1,2].forEach(n=>{fairyOn[n]=false;document.getElementById('fairy-toggle-'+n).classList.remove('on');document.getElementById('fairy-card-'+n).classList.remove('lit');clearFairyModes(n);});ZONES.forEach(zone=>{zoneState[zone.name].on=false;zoneState[zone.name].mode=null;updateToggleUI(zone.name,false);clearModeButtons(zone.name);clearRainbow(zone.name);pushState({zone:zone.name,on:false,mode:null});zone.devices.forEach(d=>sendTapo(d.ip,{on:false}));});return;}
  activeGlobalScene=scene;document.querySelectorAll('.scene-btn').forEach(b=>b.classList.remove('active'));document.getElementById('global-'+scene).classList.add('active');pushState({globalScene:scene});
  const globalBri=parseInt(document.getElementById('global-bri-slider').value);
  if(scene==='party'||scene==='gaming'){FAIRY_MACS.forEach((mac,i)=>{const n=i+1,hue=Math.floor(Math.random()*360);fairyOn[n]=true;document.getElementById('fairy-toggle-'+n).classList.add('on');document.getElementById('fairy-card-'+n).classList.add('lit');document.getElementById('fairy-hue-'+n).value=hue;clearFairyModes(n);sendFairy(mac,{on:true,hue,saturation:90,brightness:80});});sendPlug(true,'disco');discoOn=true;document.getElementById('disco-toggle').classList.add('on');document.getElementById('disco-card').classList.add('lit');sendPlug(true,'spotlight');spotlightOn=true;document.getElementById('spotlight-toggle').classList.add('on');document.getElementById('spotlight-card').classList.add('lit');sendPlug(true,'spotlight2');spotlight2On=true;document.getElementById('spotlight2-toggle').classList.add('on');document.getElementById('spotlight2-card').classList.add('lit');}
  const GAMING_WARM_IPS=['192.168.68.63','192.168.68.71'];
  ZONES.forEach(zone=>{
    if(zone.switchOnly){if(scene==='party'||scene==='gaming'){zoneState[zone.name].on=true;updateToggleUI(zone.name,true);document.getElementById('bfx-'+zone.name.replace(/\s/g,'_')+'-rainbow')?.classList.add('active');pushState({zone:zone.name,on:true,mode:'rainbow'});zone.devices.forEach(d=>sendTapo(d.ip,{on:true,effect:'rainbow'}));}}
    else if(scene==='gaming'&&zone.name==='Living Room'){zoneState[zone.name].on=true;zoneState[zone.name].mode='gaming';zoneState[zone.name].brightness=globalBri;updateToggleUI(zone.name,true);setModeButton(zone.name,'gaming');pushState({zone:zone.name,on:true,mode:'gaming',brightness:globalBri});const k=zone.name.replace(/\s/g,'_');const s=document.getElementById('bri-'+k);const v=document.getElementById('bri-val-'+k);if(s)s.value=globalBri;if(v)v.textContent=globalBri+'%';zone.devices.forEach(d=>{if(GAMING_WARM_IPS.includes(d.ip))sendTapo(d.ip,{on:true,color_temp:2700,brightness:gamingTableBri});else sendTapo(d.ip,{on:true,hue:Math.floor(Math.random()*360),saturation:90,brightness:globalBri});});}
    else{const es=(scene==='gaming')?'party':scene;zoneState[zone.name].on=true;zoneState[zone.name].mode=es;zoneState[zone.name].brightness=globalBri;updateToggleUI(zone.name,true);setModeButton(zone.name,es);pushState({zone:zone.name,on:true,mode:es,brightness:globalBri});const k=zone.name.replace(/\s/g,'_');const s=document.getElementById('bri-'+k);const v=document.getElementById('bri-val-'+k);if(s)s.value=globalBri;if(v)v.textContent=globalBri+'%';applyScene(zone.devices,es,globalBri);}
  });
  pushState({globalBrightness:globalBri});
}

function applyScene(devices,scene,bri){devices.forEach(d=>{if(scene==='work')sendTapo(d.ip,{on:true,color_temp:4500,brightness:bri});else if(scene==='cosy')sendTapo(d.ip,{on:true,color_temp:2700,brightness:bri});else if(scene==='party')sendTapo(d.ip,{on:true,hue:Math.floor(Math.random()*360),saturation:90,brightness:bri});});}
function onGlobalBriInput(v){document.getElementById('global-bri-val').textContent=v+'%';}
function sendGlobalBrightness(val){const bri=parseInt(val);pushState({globalBrightness:bri});ZONES.forEach(zone=>{if(zoneState[zone.name].on&&!zone.switchOnly){zoneState[zone.name].brightness=bri;const k=zone.name.replace(/\s/g,'_');const s=document.getElementById('bri-'+k);const v=document.getElementById('bri-val-'+k);if(s)s.value=bri;if(v)v.textContent=bri+'%';pushState({zone:zone.name,brightness:bri});zone.devices.forEach(d=>sendTapo(d.ip,{brightness:bri}));}});}
function onZoneBriInput(z,val){document.getElementById('bri-val-'+z.replace(/\s/g,'_')).textContent=val+'%';}
function sendZoneBrightness(z,val){
  const bri=parseInt(val);
  zoneState[z].brightness=bri;
  pushState({zone:z,brightness:bri});
  if(zoneState[z].on){
    const GAMING_WARM_IPS=['192.168.68.63','192.168.68.71'];
    ZONES.find(zz=>zz.name===z).devices.forEach(d=>{
      if(z==='Living Room'&&zoneState[z].mode==='gaming'&&GAMING_WARM_IPS.includes(d.ip))return;
      sendTapo(d.ip,{brightness:bri});
    });
  }
}
function onTableBriInput(val){document.getElementById('table-bri-val').textContent=val+'%';}
function sendTableBrightness(val){
  gamingTableBri=parseInt(val);
  const GAMING_WARM_IPS=['192.168.68.63','192.168.68.71'];
  GAMING_WARM_IPS.forEach(ip=>sendTapo(ip,{brightness:gamingTableBri,color_temp:2700}));
}
async function sendTapo(ip,payload){try{await fetch(SERVER+'/tapo/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ip,...payload})});}catch(e){}}

// ── FAIRY LIGHTS ──────────────────────────────────────────────
const fairyOn={1:false,2:false};
const fairyDebounce={};

function clearFairyModes(num){
  MUSIC_MODES.forEach(m=>document.getElementById('fm-'+num+'-'+m)?.classList.remove('active'));
}

function toggleFairy(mac,num){
  fairyOn[num]=!fairyOn[num];
  document.getElementById('fairy-toggle-'+num).classList.toggle('on',fairyOn[num]);
  document.getElementById('fairy-card-'+num).classList.toggle('lit',fairyOn[num]);
  if(!fairyOn[num])clearFairyModes(num);
  sendFairy(mac,{on:fairyOn[num]});
}

function setFairy(mac,num,hue,saturation,brightness,white=false){
  fairyOn[num]=true;
  document.getElementById('fairy-toggle-'+num).classList.add('on');
  document.getElementById('fairy-card-'+num).classList.add('lit');
  document.getElementById('fairy-hue-'+num).value=hue;
  document.getElementById('fairy-bri-'+num).value=brightness;
  document.getElementById('fairy-bri-val-'+num).textContent=brightness+'%';
  clearFairyModes(num);
  if(white)sendFairy(mac,{on:true,white:true,brightness});
  else sendFairy(mac,{on:true,hue,saturation,brightness});
}

function setFairyMusic(mac,num,mode){
  fairyOn[num]=true;
  document.getElementById('fairy-toggle-'+num).classList.add('on');
  document.getElementById('fairy-card-'+num).classList.add('lit');
  clearFairyModes(num);
  document.getElementById('fm-'+num+'-'+mode)?.classList.add('active');
  const sens=parseInt(document.getElementById('fairy-mic-'+num).value);
  const bri=parseInt(document.getElementById('fairy-bri-'+num).value);
  const hue=parseInt(document.getElementById('fairy-hue-'+num).value);
  sendFairy(mac,{on:true,music:mode,sensitivity:sens,brightness:bri,hue});
}

function onFairyBriInput(num,val){document.getElementById('fairy-bri-val-'+num).textContent=val+'%';}

function setFairyFromSliders(mac,num){
  clearTimeout(fairyDebounce[num]);
  fairyDebounce[num]=setTimeout(()=>{
    const hue=parseInt(document.getElementById('fairy-hue-'+num).value);
    const bri=parseInt(document.getElementById('fairy-bri-'+num).value);
    fairyOn[num]=true;
    document.getElementById('fairy-toggle-'+num).classList.add('on');
    document.getElementById('fairy-card-'+num).classList.add('lit');
    clearFairyModes(num);
    sendFairy(mac,{on:true,hue,saturation:90,brightness:bri});
  },300);
}

async function sendFairy(mac,payload){
  try{await fetch(SERVER+'/fairy/control',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mac,...payload})});}
  catch(e){console.error('Fairy error:',e);}
}

// ── DISCO BALL ────────────────────────────────────────────────
let discoOn = false;

function toggleDisco() {
  discoOn = !discoOn;
  document.getElementById('disco-toggle').classList.toggle('on', discoOn);
  document.getElementById('disco-card').classList.toggle('lit', discoOn);
  sendPlug(discoOn, 'disco');
}

let spotlightOn = false;

function toggleSpotlight() {
  spotlightOn = !spotlightOn;
  document.getElementById('spotlight-toggle').classList.toggle('on', spotlightOn);
  document.getElementById('spotlight-card').classList.toggle('lit', spotlightOn);
  sendPlug(spotlightOn, 'spotlight');
}

let spotlight2On = false;

function toggleSpotlight2() {
  spotlight2On = !spotlight2On;
  document.getElementById('spotlight2-toggle').classList.toggle('on', spotlight2On);
  document.getElementById('spotlight2-card').classList.toggle('lit', spotlight2On);
  sendPlug(spotlight2On, 'spotlight2');
}

async function sendPlug(on, device = 'disco') {
  try {
    await fetch(SERVER+'/plug/control', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ on, device }) });
  } catch(e) {}
}
function resendFairyMusic(mac, num) {
  const activeMode = MUSIC_MODES.find(m => document.getElementById('fm-'+num+'-'+m)?.classList.contains('active'));
  if (!activeMode) return;
  setFairyMusic(mac, num, activeMode);
}
